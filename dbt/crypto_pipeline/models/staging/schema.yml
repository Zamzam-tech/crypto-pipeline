version: 2

models:
  - name: stg_coins
    description: "This is the staging model for the raw crypto data. It selects relevant columns and performs basic transformations."
    columns:
      - name: coin_id
        description: "The unique identifier for each cryptocurrency"
        tests:
          - unique
          - not_null
      - name: symbol
        description: "The ticker symbol for the cryptocurrency (e.g., BTC for Bitcoin)"
        tests:
          - not_null
      - name: current_price
        description: "The current price of the cryptocurrency in USD"
        tests:
          - not_null
      - name: market_cap
        description: "The market capitalization of the cryptocurrency in USD"
        tests:
          - not_null
      - name: total_volume
        description: "The total trading volume of the cryptocurrency in the last 24 hours"
        tests:
          - not_null
      - name: last_updated
        description: "The timestamp of the last update for the cryptocurrency data"
        tests:
          - not_null
      - name: ingested_at
        description: "The timestamp of when the data was ingested into the staging model"
        tests:
          - not_null

